<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Add Student')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav th:replace="~{fragments :: navbar}"></nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Add New Student</h2>
            
            <div th:if="${errorMessage}" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4">
                <p class="text-sm text-red-700" th:text="${errorMessage}">Error message</p>
            </div>

            <form th:action="@{/students/new}" th:object="${student}" method="post" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-gray-700">First Name</label>
                        <input type="text" th:field="*{firstName}" id="firstName" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue sm:text-sm">
                    </div>
                    <div>
                        <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name</label>
                        <input type="text" th:field="*{lastName}" id="lastName" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue sm:text-sm">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" th:field="*{email}" id="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue sm:text-sm">
                </div>

                <!-- Note: Creating a student manually here might require handling User creation logic in the controller if they need login access -->
                <div class="bg-blue-50 p-4 rounded-md">
                    <p class="text-sm text-blue-700">
                        <strong>Note:</strong> This will create a student record. To give them login access, please use the Registration page or ensure a User account is linked.
                    </p>
                </div>

                <div class="flex justify-end gap-4 pt-4">
                    <a th:href="@{/students}" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue">Cancel</a>
                    <button type="submit" class="px-4 py-2 bg-brand-blue text-white rounded-md text-sm font-medium hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue transition-colors">Save Student</button>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
