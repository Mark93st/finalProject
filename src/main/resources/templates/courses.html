<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Courses')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav th:replace="~{fragments :: navbar}"></nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Courses</h1>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/courses/new}" class="bg-brand-blue text-white px-4 py-2 rounded hover:bg-blue-800 transition-colors shadow-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                Add New Course
            </a>
        </div>

        <div th:if="${param.success}" class="mb-6 bg-green-50 border-l-4 border-green-500 p-4">
            <p class="text-sm text-green-700" th:text="${param.success}">Success message</p>
        </div>
        <div th:if="${param.error}" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4">
            <p class="text-sm text-red-700" th:text="${param.error}">Error message</p>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Credits</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                            <th sec:authorize="hasAnyRole('ADMIN', 'STUDENT')" scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="course : ${courses}" class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${course.title}">Math 101</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${course.credits}">3</td>
                            <td class="px-6 py-4 text-sm text-gray-500" th:text="${course.description}">Introduction to Mathematics</td>
                            <td sec:authorize="hasRole('ADMIN')" class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <a th:href="@{/courses/edit/{id}(id=${course.id})}" class="text-indigo-600 hover:text-indigo-900 mr-4 font-semibold">Edit</a>
                                <a th:href="@{/courses/delete/{id}(id=${course.id})}" class="text-red-600 hover:text-red-900 font-semibold" onclick="return confirm('Are you sure you want to delete this course?')">Delete</a>
                            </td>
                            <td sec:authorize="hasRole('STUDENT')" class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <form th:action="@{/enrollments/enroll}" method="post">
                                    <input type="hidden" name="courseId" th:value="${course.id}" />
                                    <button type="submit" class="text-brand-blue hover:text-blue-800 font-semibold">Enroll</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
