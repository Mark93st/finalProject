<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Students')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav th:replace="~{fragments :: navbar}"></nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Students Directory</h1>
        </div>

        <div th:if="${param.success}" class="mb-6 bg-green-50 border-l-4 border-green-500 p-4">
            <p class="text-sm text-green-700" th:text="${param.success}">Success message</p>
        </div>
        <div th:if="${param.error}" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4">
            <p class="text-sm text-red-700" th:text="${param.error}">Error message</p>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">First Name</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Name</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th sec:authorize="hasRole('ADMIN')" scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="student : ${students}" class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${student.id}">1</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${student.firstName}">John</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${student.lastName}">Doe</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${student.email}">john@example.com</td>
                            <td sec:authorize="hasRole('ADMIN')" class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <a th:href="@{/students/edit/{id}(id=${student.id})}" class="text-indigo-600 hover:text-indigo-900 mr-4 font-semibold">Edit</a>
                                <a th:href="@{/students/delete/{id}(id=${student.id})}" class="text-red-600 hover:text-red-900 font-semibold" onclick="return confirm('Are you sure you want to delete this student?')">Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
