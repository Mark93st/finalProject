<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My Courses')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav th:replace="~{fragments :: navbar}"></nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">My Courses</h1>
            <a th:href="@{/courses}" class="bg-brand-blue text-white px-4 py-2 rounded hover:bg-blue-800 transition-colors shadow-sm text-sm font-medium">Browse Catalog</a>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Course Title</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Credits</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="enrollment : ${enrollments}" class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${enrollment.course.title}">Math 101</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${enrollment.course.credits}">3</td>
                            <td class="px-6 py-4 text-sm text-gray-500" th:text="${enrollment.course.description}">Desc</td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <form th:action="@{/enrollments/delete/{id}(id=${enrollment.id})}" method="post" onsubmit="return confirm('Are you sure you want to drop this course?');">
                                    <button type="submit" class="text-red-600 hover:text-red-900 font-semibold">Drop</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
