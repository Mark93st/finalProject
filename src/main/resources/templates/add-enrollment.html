<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('New Enrollment')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav th:replace="~{fragments :: navbar}"></nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">New Enrollment</h2>

            <div th:if="${errorMessage}" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4">
                <p class="text-sm text-red-700" th:text="${errorMessage}">Error message</p>
            </div>

            <form th:action="@{/enrollments/new}" method="post" class="space-y-6">
                <div>
                    <label for="studentId" class="block text-sm font-medium text-gray-700">Student</label>
                    <select id="studentId" name="studentId" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue sm:text-sm">
                        <option value="">Select a student</option>
                        <option th:each="student : ${students}"
                                th:value="${student.id}"
                                th:text="${student.firstName + ' ' + student.lastName}">
                        </option>
                    </select>
                </div>

                <div>
                    <label for="courseId" class="block text-sm font-medium text-gray-700">Course</label>
                    <select id="courseId" name="courseId" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue sm:text-sm">
                        <option value="">Select a course</option>
                        <option th:each="course : ${courses}"
                                th:value="${course.id}"
                                th:text="${course.title + ' (' + course.credits + ' credits)'}">
                        </option>
                    </select>
                </div>

                <div class="flex justify-end gap-4 pt-4">
                    <a th:href="@{/enrollments}" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue">Cancel</a>
                    <button type="submit" class="px-4 py-2 bg-brand-blue text-white rounded-md text-sm font-medium hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue transition-colors">Enroll Student</button>
                </div>
            </form>
        </div>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
