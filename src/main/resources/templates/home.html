<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Home')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav th:replace="~{fragments :: navbar}"></nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md p-8 mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-4">Welcome to the Student Management System</h1>
            <p class="text-gray-600 text-lg">Manage courses, students, and enrollments efficiently.</p>
            
            <div th:if="${param.success}" class="mt-4 bg-green-50 border-l-4 border-green-500 p-4">
                <p class="text-sm text-green-700" th:text="${param.success}">Success message</p>
            </div>
        </div>

        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            <a th:href="@{/courses}" class="block bg-white rounded-lg shadow hover:shadow-md transition-shadow p-6 border-t-4 border-brand-blue group">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-bold text-gray-800 group-hover:text-brand-blue transition-colors">Courses</h3>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-gray-400 group-hover:text-brand-blue transition-colors">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                    </svg>
                </div>
                <p class="text-gray-600">Browse available courses and manage the course catalog.</p>
            </a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="block bg-white rounded-lg shadow hover:shadow-md transition-shadow p-6 border-t-4 border-purple-500 group">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-bold text-gray-800 group-hover:text-purple-600 transition-colors">Admin Panel</h3>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-gray-400 group-hover:text-purple-600 transition-colors">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z" />
                    </svg>
                </div>
                <p class="text-gray-600">Access administrative tools for students and enrollments.</p>
            </a>
            <!-- Additional dashboard cards can be added here -->
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
