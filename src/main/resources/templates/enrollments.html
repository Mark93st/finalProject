<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Enrollments')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav th:replace="~{fragments :: navbar}"></nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Enrollments</h1>
            <a sec:authorize="hasRole('STUDENT')" th:href="@{/courses}" class="bg-brand-blue text-white px-4 py-2 rounded hover:bg-blue-800 transition-colors shadow-sm text-sm font-medium">
                Browse Courses
            </a>
        </div>

        <div th:if="${param.success}" class="mb-6 bg-green-50 border-l-4 border-green-500 p-4">
            <p class="text-sm text-green-700" th:text="${param.success}">Success message</p>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th sec:authorize="hasRole('ADMIN')" scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Student</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Course</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Credits</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Grade</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="enrollment : ${enrollments}" class="hover:bg-gray-50">
                            <td sec:authorize="hasRole('ADMIN')" class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                                <span th:text="${enrollment.student.firstName + ' ' + enrollment.student.lastName}">Student Name</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${enrollment.course.title}">Math 101</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${enrollment.course.credits}">3</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                <span th:if="${enrollment.grade != null}" th:text="${enrollment.grade}" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">A</span>
                                <span th:if="${enrollment.grade == null}" class="text-gray-400 italic">Not graded</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <div sec:authorize="hasRole('ADMIN')" class="inline-flex items-center gap-2">
                                    <form th:action="@{/enrollments/grade/{id}(id=${enrollment.id})}" method="post" class="flex items-center gap-2">
                                        <input type="text" name="grade" placeholder="Grade" class="w-16 rounded-md border-gray-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue sm:text-xs py-1 px-2">
                                        <button type="submit" class="text-indigo-600 hover:text-indigo-900 text-xs uppercase font-bold">Save</button>
                                    </form>
                                    <span class="text-gray-300">|</span>
                                </div>
                                <form th:action="@{/enrollments/delete/{id}(id=${enrollment.id})}" method="post" class="inline-block" onsubmit="return confirm('Are you sure you want to drop this course?');">
                                    <button type="submit" class="text-red-600 hover:text-red-900 font-semibold ml-2">
                                        <span sec:authorize="hasRole('ADMIN')">Delete</span>
                                        <span sec:authorize="hasRole('STUDENT')">Drop</span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
